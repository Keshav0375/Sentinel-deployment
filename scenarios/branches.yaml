    expected_culprit: self

  # ── Case iii — runtime error: green pipeline, a runtime-health synthetic fires ─
  # Verify only calls /health and /version, so every one of these passes it.
  - branch: runtime/01
    case: iii
    fault: GET / returns 500
    expected_signal_type: runtime_error
    expected_resolution: rollback_or_escalate
    also_expected: []
    expected_culprit: self
  - branch: runtime/02
